# Render Blueprint for OMNIVISTA AI (fastapi web service)
# Render runs `startCommand` on every deploy with $PORT already set.
services:
  - type: web
    name: omnivista-api
    runtime: python
    plan: free                    # upgrade to starter/pro for real workloads
    rootDir: backend              # commands run from ./backend
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: ENVIRONMENT
        value: production
      - key: MOCK_MODE
        value: "true"               # zero external deps; set false when using real providers
      - key: CORS_ORIGINS
        value: https://your-frontend.vercel.app
      - key: STORAGE_PROVIDER
        value: local                # ephemeral on Render; use s3/vercel-blob for persistence
      - key: VECTOR_DB_PROVIDER
        value: memory               # swap to pinecone in production
      - key: TASK_QUEUE_PROVIDER
        value: inline               # swap to a managed queue for long ingestion
